openapi: 3.0.3
info:
  title: Com7 → LarkBase Sync API
  version: "1.0.0"
  description: |
    Control plane สำหรับ sync ข้อมูลขาย Com7 (MySQL) ขึ้น LarkBase แบบ one-way.
    ทุก endpoint (ยกเว้น /health) ต้องแนบ credential ของ Lark app ผ่าน header:
    `X-Lark-App-Id` และ `X-Lark-App-Secret` (server แลกเป็น token ต่อ request).

    **กลุ่มงาน 4 แบบ:**
    - `/base/*`   — เตรียม/ดูสถานะ base รายปี (provision 250 partition table)
    - `/sync/full*` — backfill ทั้งปี (ครั้งแรก/เพิ่มปีย้อนหลัง) + ตรวจ/ซ่อม
    - `/sync/incremental` — ดึงเฉพาะที่ใหม่/เปลี่ยน (รันบ่อย)
    - `/sync/hard-full` — ล้างทั้งปีแล้ว rebuild (กู้ตอนพังหนัก)

servers:
  - url: http://localhost:3000
    description: local

tags:
  - name: Health
  - name: Base
    description: จัดการ base รายปี (โครงสร้าง table)
  - name: Full Sync
    description: backfill ทั้งปี + reconciliation
  - name: Incremental
    description: sync ต่อเนื่อง (ใหม่ + อัปเดต)
  - name: Recovery
    description: กู้ข้อมูลแบบ nuke & rebuild

components:
  securitySchemes:
    LarkAppId:
      type: apiKey
      in: header
      name: X-Lark-App-Id
    LarkAppSecret:
      type: apiKey
      in: header
      name: X-Lark-App-Secret
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    JobSummary:
      type: object
      properties:
        year: { type: integer, example: 2026 }
        jobId: { type: integer, example: 42 }
        status: { type: string, enum: [ready, claimed, done, dead], example: ready }
    IncrementalSummary:
      type: object
      properties:
        since: { type: string, example: "2026-07-03 00:00:00", description: "watermark ที่เริ่มกวาด (CE Bangkok)" }
        newWatermark: { type: string, example: "2026-07-08 21:58:10", description: "watermark ใหม่ = max UTime ที่ประมวลผล" }
        scanned: { type: integer, example: 1023, description: "จำนวนแถวที่ดึงมา (หลัง dedup)" }
        inserted: { type: integer, example: 300 }
        updated: { type: integer, example: 0 }
        skipped: { type: integer, example: 723, description: "checksum ตรง = ไม่ต้องทำอะไร" }

security:
  - LarkAppId: []
    LarkAppSecret: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness + ping ops DB
      description: |
        **คืออะไร:** เช็คว่า process ยังอยู่ + ต่อ MySQL (ops) ได้ไหม
        **ใช้ตอนไหน:** load balancer / monitoring / เช็คก่อนยิงเส้นอื่น
      responses:
        "200": { description: ok }
        "503": { description: degraded (ต่อ ops DB ไม่ได้) }

  /base/init:
    post:
      tags: [Base]
      summary: Provision base รายปี (สร้าง 250 partition table + field)
      description: |
        **คืออะไร:** สร้าง table `itec_001..250` + field ตาม schema จริง ใน 1 base ของปีนั้น (idempotent + resumable)
        **เอาไว้ทำอะไร:** เตรียมโครงให้พร้อมก่อน backfill — คนไปเขียนสูตร Lark manual บน table เหล่านี้
        **ใช้ตอนไหน:** ครั้งแรกต่อปี / เพิ่มปีใหม่ (สร้าง base เปล่าใน Lark เอง แล้วส่ง base_id มา)
        > ยิงซ้ำได้ ถ้า time budget หมดจะคืน partial — ยิงต่อจนครบ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, base]
              properties:
                year: { type: integer, example: 2026, description: "ปี ค.ศ. (2000–2100)" }
                base: { type: string, example: "TihrbIr5PaNwI7sS9jFl6gCrgCg", description: "Lark base_id (สร้าง manual แล้วแชร์ให้ app)" }
      responses:
        "200": { description: "สรุปผล provision (สร้างกี่ table, เหลือกี่ table)" }
        "400": { description: bad params, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: base ไม่พบ/app เข้าไม่ถึง }

  /base/remove-partitions:
    post:
      tags: [Base]
      summary: ลบ partition table ทั้งหมดของปี (teardown)
      description: |
        **คืออะไร:** **drop** table `itec_*` ของปีนั้นทิ้ง (ลบทั้ง table ไม่ใช่แค่ record)
        **เอาไว้ทำอะไร:** รื้อ base ที่ provision ผิด / เลิกใช้ปีนั้น
        **ใช้ตอนไหน:** งาน teardown เท่านั้น — **ไม่ใช่**สำหรับล้างข้อมูล (อันนั้นใช้ /sync/hard-full)
        > แนะนำยิง `?dryRun=true` ดูก่อนว่าจะลบอะไรบ้าง
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean }
          description: "true = แค่บอกว่าจะลบอะไร ไม่ลบจริง"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, base]
              properties:
                year: { type: integer, example: 2026 }
                base: { type: string, example: "TihrbIr5PaNwI7sS9jFl6gCrgCg" }
      responses:
        "200": { description: "สรุปว่า drop (หรือจะ drop) table ไหนบ้าง" }
        "400": { description: bad params }
        "404": { description: base ไม่พบ }

  /base/status:
    get:
      tags: [Base]
      summary: สถานะ provision ของปี (อ่าน MySQL ล้วน)
      description: |
        **คืออะไร:** ดูว่าปีนั้น provision ไปกี่ partition แล้ว (อ่านจาก ops ไม่ยิง Lark → เร็ว)
        **ใช้ตอนไหน:** เช็คความคืบหน้า /base/init หรือดูว่าปีพร้อม backfill ยัง
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, example: 2026 }
      responses:
        "200": { description: "สถานะปี (provisioned/complete, จำนวน partition)" }
        "400": { description: year หาย/ไม่ใช่ integer }
        "404": { description: ปียังไม่ถูก provision }

  /sync/full:
    post:
      tags: [Full Sync]
      summary: enqueue backfill ทั้งปี (background job)
      description: |
        **คืออะไร:** สั่ง backfill ข้อมูล **ทั้งปี** จาก itec → Lark (ดึงเป็น chunk, จอง partition, เขียน mapping)
        **เอาไว้ทำอะไร:** เติมข้อมูลครั้งแรกของปี / เพิ่มปีย้อนหลัง
        **ใช้ตอนไหน:** หลัง /base/init เสร็จ. เป็น **async** — คืน jobId แล้วไปทำเบื้องหลัง (ต้องมี worker รัน)
        > idempotent: ถ้ามี job ปีนั้น active อยู่แล้ว คืนตัวเดิม
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: { type: integer, example: 2026 }
      responses:
        "202": { description: enqueued, content: { application/json: { schema: { $ref: "#/components/schemas/JobSummary" } } } }
        "400": { description: year ไม่ใช่ integer }
        "404": { description: ปียังไม่ provision }

  /sync/full/status:
    get:
      tags: [Full Sync]
      summary: ดูสถานะ/ความคืบหน้าของ backfill job
      description: |
        **คืออะไร:** สถานะ job + checkpoint ล่าสุด (อ่าน ops ไม่ยิง Lark)
        **ใช้ตอนไหน:** ตามงาน backfill ที่สั่งไป ว่าถึงไหนแล้ว/เสร็จ/ตาย
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, example: 2026 }
      responses:
        "200":
          description: สถานะ job
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  jobStatus: { type: string, example: claimed }
                  jobId: { type: integer }
                  attempts: { type: integer }
                  checkpoint: { type: object, nullable: true }
                  lastRunAt: { type: string, nullable: true }
        "400": { description: year หาย }

  /sync/full/check:
    get:
      tags: [Full Sync]
      summary: Reconcile L1/L2 — หา drift (count + checksum)
      description: |
        **คืออะไร:** เทียบ count(source) vs total บน Lark (L1) + checksum drift (L2) ต่อ partition
        **เอาไว้ทำอะไร:** ตรวจว่าข้อมูล Lark ยังตรงกับ Com7 ไหม โดยไม่ fetch record จาก Lark
        **ใช้ตอนไหน:** ตรวจสุขภาพเป็นระยะ / ก่อนตัดสินใจ heal
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, example: 2026 }
      responses:
        "200":
          description: ผลตรวจ
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  done: { type: boolean }
                  partitionsChecked: { type: integer }
                  partitionsTotal: { type: integer }
                  findings: { type: array, items: { type: object } }
        "400": { description: year หาย }
        "404": { description: ปียังไม่ provision }

  /sync/full/heal:
    post:
      tags: [Full Sync]
      summary: ซ่อม drift ที่ check เจอ (create/update/delete ส่วนต่าง)
      description: |
        **คืออะไร:** ซ่อมเฉพาะจุดที่เพี้ยน — ลบ orphan / สร้าง record ที่หาย ให้ Lark = source
        **เอาไว้ทำอะไร:** แก้ drift แบบ **ผ่าตัดเฉพาะจุด** (ไม่ใช่ล้างทั้งปี)
        **ใช้ตอนไหน:** หลัง /check เจอ finding — ลองซ่อมก่อนตัดสินใจใช้ hard-full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: { type: integer, example: 2026 }
      responses:
        "200":
          description: ผลการซ่อม
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  done: { type: boolean }
                  partitionsProcessed: { type: integer }
                  actionsTaken: { type: array, items: { type: object } }
        "400": { description: year ไม่ใช่ integer }
        "404": { description: ปียังไม่ provision }

  /sync/incremental:
    post:
      tags: [Incremental]
      summary: กวาดข้อมูลใหม่ + อัปเดต (UTime > last sync)
      description: |
        **คืออะไร:** ดึงแถวที่ `UTime >= last_sync` จาก **itec + itec-today** → insert (ใหม่) / update (checksum เปลี่ยน) / skip (เหมือนเดิม) แล้วเลื่อน watermark
        **เอาไว้ทำอะไร:** sync ต่อเนื่อง หลัง backfill รอบแรก — โหลดเบา (ทำเฉพาะที่เปลี่ยน)
        **ใช้ตอนไหน:** ยิงซ้ำ ๆ ตามรอบ (เช่นทุก 15 นาที–1 วัน). **sync** (ไม่ใช่ job) — รอผลในคำขอเลย
        > ไม่ต้องส่ง body. ทุก call กวาด backlog ให้หมดในครั้งเดียว
      responses:
        "200":
          description: สรุปผลรอบนี้
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncrementalSummary" }
        "409":
          description: มีข้อมูลของปีที่ยังไม่ provision base — ไม่เขียนอะไรเลย บอกปีที่ขาด
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  years: { type: array, items: { type: integer }, example: [2015, 2027] }

  /sync/hard-full:
    post:
      tags: [Recovery]
      summary: "🔴 ล้างทั้งปีแล้ว rebuild (disaster recovery)"
      description: |
        **คืออะไร:** **ลบ record ทั้งหมด**ของปีบน Lark + เคลียร์ mapping/state → แล้ว enqueue backfill ใหม่ (คง table + สูตรไว้)
        **เอาไว้ทำอะไร:** กู้ตอนข้อมูลพังหนักจน /heal ซ่อมไม่ไหว — "เผาทิ้งแล้วสร้างใหม่"
        **ใช้ตอนไหน:** ทางเลือกสุดท้าย. เป็น **background job** (ต้องมี worker) + ใช้เวลานาน (ลบล้าน + สร้างล้าน)
        > ⚠️ ทำลายข้อมูลจริง — บังคับ `confirm: true` ใน body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, confirm]
              properties:
                year: { type: integer, example: 2026 }
                confirm: { type: boolean, example: true, description: "ต้องเป็น true เป๊ะ ไม่งั้น 400" }
      responses:
        "202": { description: enqueued, content: { application/json: { schema: { $ref: "#/components/schemas/JobSummary" } } } }
        "400": { description: "year ไม่ใช่ integer หรือ confirm ≠ true" }
        "404": { description: ปียังไม่ provision }
